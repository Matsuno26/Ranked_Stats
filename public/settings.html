<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranked Stats · Mes comptes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 1l14 8v14l-14 8-14-8V9z' fill='%23ff4655'/><path d='M8 21l5-6 4 3 7-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .games { display: grid; gap: 14px; }
    .game { position: relative; isolation: isolate; overflow: hidden; padding: 18px 20px; transition: border-color .15s; }
    /* Visuel du jeu en fond : ancré à droite et fondu vers la gauche pour que les champs restent lisibles. */
    .game::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: var(--art) var(--art-pos, center) / cover no-repeat;
      mask-image: linear-gradient(100deg, transparent 18%, rgba(0,0,0,.55) 55%, #000 95%);
      opacity: .42; transition: opacity .25s, filter .25s;
    }
    .game.off::before { opacity: .14; filter: grayscale(1); }
    .game .field input, .game .field select { background: color-mix(in srgb, var(--arena) 88%, transparent); backdrop-filter: blur(6px); }
    .game .help { text-shadow: 0 1px 2px rgba(0,0,0,.6); }
    .game.filled { border-color: color-mix(in srgb, var(--game) 45%, var(--line)); }
    .game.off { border-color: var(--border); }
    .game.off .game-body { display: none; }
    .game.off .game-head { margin-bottom: 0; opacity: .6; }
    .switch { position: relative; width: 46px; height: 26px; flex: none; }
    .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--axis); transition: .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .15s; }
    .switch input:checked + span { background: var(--game); }
    .switch input:checked + span::after { transform: translateX(20px); }
    .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
    .game-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .game-head h2 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: .01em; }
    .game-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .pill { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .game.filled .pill { color: var(--up-text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .help { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
    .help a { color: var(--text-2); }
    .test-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .test-out { font-size: 13px; color: var(--text-2); }
    .test-out.ok { color: var(--up-text); }
    .test-out.err { color: var(--down-text); }
    .actions { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 16px 0; margin-top: 10px;
      background: linear-gradient(transparent, var(--page) 40%); }
    .actions .note { margin-right: auto; color: var(--muted); font-size: 13px; }
    /* Sélecteur de profil Overwatch */
    .picker { margin-top: 14px; }
    .picker:empty { display: none; }
    .picker p { margin: 0 0 10px; color: var(--chalk-2); font-size: 14px; }
    .picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; max-height: 340px; overflow-y: auto; padding: 2px; }
    .profile {
      position: relative; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;
      padding: 10px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; isolation: isolate;
      background: var(--arena);
    }
    .profile::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--card) center / cover; opacity: .45; }
    .profile:hover:not(:disabled) { border-color: var(--game); }
    .profile.mine { border-color: var(--game); box-shadow: 0 0 0 1px var(--game); }
    .profile:disabled { cursor: not-allowed; opacity: .45; }
    .profile img { width: 44px; height: 44px; border-radius: 8px; flex: none; }
    .profile b { display: block; font-size: 14px; }
    .profile small { display: block; color: var(--chalk-2); font-size: 12px; text-shadow: 0 1px 2px #000; }
    .chosen { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--chalk-2); }
    .chosen img { width: 36px; height: 36px; border-radius: 8px; }
    .chosen:empty { display: none; }

    @media (max-width: 640px) {
      .actions .note { display: none; }
      /* Téléphone : le titre garde toute la largeur, l'état du jeu passe sur la ligne suivante */
      .game-head { flex-wrap: wrap; row-gap: 8px; }
      .game-head > div:nth-child(2) { flex: 1 1 0; min-width: 0; }
      .game-head h2 { font-size: 23px; }
      .game-head::after { content: ""; order: 4; flex-basis: 100%; } /* saut de ligne avant l'état */
      .pill { order: 5; margin-left: 54px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Ranked Stats, accueil"><span class="brand-mark">R</span><span class="brand-label">Ranked Stats</span></a>
    <nav class="nav">
      <a href="/">Stats</a>
      <a href="/reglages" aria-current="page">Mes comptes</a>
    </nav>
  </header>

  <main>
    <h1>Mes comptes</h1>
    <p class="lead">Coche les jeux auxquels tu joues en ranked et tape tes pseudos. Un jeu décoché disparaît de tes stats.</p>

    <div class="games" id="games"></div>

    <div class="actions">
      <span class="note">🔒 Tes comptes sont gardés dans ton navigateur, chacun voit ses propres stats.</span>
      <a class="btn ghost" href="/">Annuler</a>
      <button class="btn primary" id="save" type="button">Voir mes stats</button>
    </div>
  </main>
  <div class="toast" id="toast"></div>

  <script src="accounts.js"></script>
  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function render() {
      const saved = Accounts.load();
      $('#games').innerHTML = ACCOUNT_GAMES.map((g) => {
        const c = saved[g.id] || {};
        const fields = g.fields.map((f) => {
          const id = `${g.id}-${f.k}`;
          if (f.type === 'hidden') return `<input type="hidden" id="${id}" data-k="${f.k}" value="${esc(c[f.k])}">`;
          const input = f.type === 'select'
            ? `<select id="${id}" data-k="${f.k}">${f.options.map(([v, l]) => `<option value="${v}" ${c[f.k] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`
            : `<input id="${id}" data-k="${f.k}" type="text" value="${esc(c[f.k])}" placeholder="${esc(f.ph || '')}" autocomplete="off" spellcheck="false">`;
          return `<div class="field"><label for="${id}">${f.label}</label>${input}${f.hint ? `<small>${f.hint}</small>` : ''}</div>`;
        }).join('');
        return `
          <section class="card game" data-game="${g.id}" style="--art: url('${g.art}'); --art-pos: ${g.artPos}">
            <div class="game-head">
              <div class="game-badge">${g.short}</div>
              <div><h2>${g.name}</h2><p>${g.desc}</p></div>
              <span class="pill"></span>
              <label class="switch" title="Afficher ${g.name}"><input type="checkbox" data-enabled ${Accounts.isEnabled(g.id, saved[g.id]) ? 'checked' : ''} aria-label="Afficher ${g.name} dans mes stats"><span></span></label>
            </div>
            <div class="game-body">
              <div class="grid">${fields}</div>
              <p class="help">${g.help}</p>
              <div class="chosen"></div>
              <div class="test-row">
                <button class="btn" type="button" data-test ${g.pending ? 'disabled title="Bientôt disponible"' : ''}>Vérifier le compte</button>
                <span class="test-out" aria-live="polite"></span>
              </div>
              <div class="picker" aria-live="polite"></div>
            </div>
          </section>`;
      }).join('');
      document.querySelectorAll('.game').forEach((card) => { updatePill(card); showChosen(card); });
    }

    // Overwatch : profil choisi dans la liste (avatar + changer)
    function showChosen(card) {
      const box = card.querySelector('.chosen');
      const id = card.querySelector('[data-k="blizzardId"]')?.value;
      if (!id) { box.innerHTML = ''; return; }
      const avatar = card.querySelector('[data-k="avatar"]').value;
      box.innerHTML = `${avatar ? `<img src="${esc(avatar)}" alt="">` : ''}<span>Profil Overwatch choisi</span><button class="btn ghost" type="button" data-repick>Changer</button>`;
    }

    async function showPicker(card) {
      const box = card.querySelector('.picker');
      const tag = card.querySelector('[data-k="battletag"]').value.trim();
      const name = tag.split('#')[0].trim();
      box.innerHTML = '<p>Recherche des profils…</p>';
      const r = await fetch(`/api/ow-search?name=${encodeURIComponent(tag)}`).then((x) => x.json()).catch(() => ({ ok: false, error: 'Serveur injoignable' }));
      if (!r.ok) { box.innerHTML = `<p class="test-out err">✕ ${esc(r.error)}</p>`; return; }
      if (!r.results.length) { box.innerHTML = `<p class="test-out err">✕ Aucun profil Overwatch nommé « ${esc(name)} ». Vérifie l'orthographe.</p>`; return; }
      const pub = r.results.filter((p) => p.isPublic).length;
      const intro = r.mineFound
        ? `Ton BattleTag correspond au profil marqué « C'est toi ».`
        : tag.includes('#')
          ? `Aucun de ces ${r.total} profils « ${esc(name)} » ne correspond à ${esc(tag)}. Si tu joues sur un autre compte, choisis-le ici :`
          : `${r.total} profils s'appellent « ${esc(name)} ». Choisis le tien :`;
      box.innerHTML = `<p>${intro}${pub < r.results.length ? ' Les profils privés ne peuvent pas être lus.' : ''}</p>
        <div class="picker-grid">${r.results.map((p) => `
          <button class="profile${p.mine ? ' mine' : ''}" type="button" data-pick="${esc(p.id)}" data-avatar="${esc(p.avatar || '')}" style="--card: url('${esc(p.namecard || '')}')" ${p.isPublic ? '' : 'disabled'}>
            <img src="${esc(p.avatar || '')}" alt="" loading="lazy">
            <span><b>${esc(p.name)}${p.mine ? ' · C\'est toi' : ''}</b><small>${p.isPublic ? esc(p.title || 'Sans titre') : 'Profil privé'}</small></span>
          </button>`).join('')}</div>`;
    }

    async function verify(card) {
      const btn = card.querySelector('[data-test]');
      const out = card.querySelector('.test-out');
      const acc = readGame(card);
      if (!Accounts.isFilled(card.dataset.game, acc)) { out.className = 'test-out err'; out.textContent = 'Remplis d\'abord ton pseudo'; return; }
      btn.disabled = true; out.className = 'test-out'; out.textContent = 'Recherche du compte…';
      try {
        const r = await fetch('/api/player', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: card.dataset.game, account: acc, force: true }) }).then((x) => x.json());
        if (r.ok) {
          const qs = Object.values(r.history || {});
          const summary = qs.map((q) => `${q.name} : ${String(q.points.at(-1)?.l || q.points.at(-1)?.v).split(' · ')[0]}`).join(', ');
          out.className = 'test-out ok'; out.textContent = `✓ ${r.meta?.player || 'Compte trouvé'}${summary ? ' : ' + summary : ''}`;
        } else {
          out.className = 'test-out err'; out.textContent = `✕ ${r.error}`;
          // Overwatch : en cas de souci, on propose de parcourir les profils qui portent ce pseudo.
          if (card.dataset.game === 'overwatch' && !acc.blizzardId) {
            card.querySelector('.picker').innerHTML = `<button class="btn ghost" type="button" data-showpicker>Voir les profils « ${esc(acc.battletag.split('#')[0])} » sur Overwatch</button>`;
          }
        }
      } catch { out.className = 'test-out err'; out.textContent = '✕ Serveur injoignable'; }
      btn.disabled = false;
    }

    function readGame(card) {
      const out = {};
      card.querySelectorAll('[data-k]').forEach((el) => { out[el.dataset.k] = el.value.trim(); });
      out.enabled = card.querySelector('[data-enabled]').checked;
      return out;
    }

    function updatePill(card) {
      const acc = readGame(card);
      const on = acc.enabled;
      const filled = Accounts.isFilled(card.dataset.game, acc);
      card.classList.toggle('off', !on);
      card.classList.toggle('filled', on && filled);
      card.querySelector('.pill').textContent = !on ? 'Masqué' : Accounts.isPending(card.dataset.game) ? 'Bientôt' : filled ? '✓ Suivi' : 'Pseudo manquant';
    }

    document.addEventListener('input', (e) => {
      const card = e.target.closest('.game');
      if (!card) return;
      if (e.target.dataset.k === 'battletag') {
        card.querySelector('[data-k="blizzardId"]').value = ''; card.querySelector('[data-k="avatar"]').value = '';
        card.querySelector('.picker').innerHTML = ''; showChosen(card);
      }
      updatePill(card);
    });
    document.addEventListener('change', (e) => { const card = e.target.closest('.game'); if (card) updatePill(card); });

    document.addEventListener('click', async (e) => {
      const card = e.target.closest('.game');
      if (!card) return;
      if (e.target.closest('[data-test]')) return verify(card);
      const pick = e.target.closest('[data-pick]');
      if (pick) {
        card.querySelector('[data-k="blizzardId"]').value = pick.dataset.pick;
        card.querySelector('[data-k="avatar"]').value = pick.dataset.avatar;
        card.querySelector('.picker').innerHTML = '';
        showChosen(card);
        return verify(card);
      }
      if (e.target.closest('[data-showpicker]')) return showPicker(card);
      if (e.target.closest('[data-repick]')) {
        card.querySelector('[data-k="blizzardId"]').value = ''; card.querySelector('[data-k="avatar"]').value = '';
        showChosen(card); card.querySelector('.test-out').textContent = '';
        return showPicker(card);
      }
    });

    $('#save').addEventListener('click', () => {
      const all = {};
      document.querySelectorAll('.game').forEach((card) => { all[card.dataset.game] = readGame(card); });
      if (!Accounts.save(all)) { toast('Impossible d\'enregistrer (navigation privée ?)'); return; }
      location.href = '/';
    });

    render();
  </script>
</body>
</html>
