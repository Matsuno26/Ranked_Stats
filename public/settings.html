<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranked Stats · Mes comptes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 1l14 8v14l-14 8-14-8V9z' fill='%23ff4655'/><path d='M8 21l5-6 4 3 7-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .games { display: grid; gap: 14px; }
    .game { padding: 18px 20px; transition: border-color .15s; }
    .game.filled { border-color: color-mix(in srgb, var(--game) 45%, var(--line)); background: radial-gradient(90% 140% at 0% 0%, color-mix(in srgb, var(--game) 14%, transparent), transparent 60%), var(--stand); }
    .game.off { border-color: var(--border); }
    .game.off .game-body { display: none; }
    .game.off .game-head { margin-bottom: 0; opacity: .6; }
    .switch { position: relative; width: 46px; height: 26px; flex: none; }
    .switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--axis); transition: .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .15s; }
    .switch input:checked + span { background: var(--game); }
    .switch input:checked + span::after { transform: translateX(20px); }
    .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
    .game-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .game-head h2 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: .01em; }
    .game-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .pill { margin-left: auto; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .game.filled .pill { color: var(--up-text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .help { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
    .help a { color: var(--text-2); }
    .test-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .test-out { font-size: 13px; color: var(--text-2); }
    .test-out.ok { color: var(--up-text); }
    .test-out.err { color: var(--down-text); }
    .actions { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 16px 0; margin-top: 10px;
      background: linear-gradient(transparent, var(--page) 40%); }
    .actions .note { margin-right: auto; color: var(--muted); font-size: 13px; }
    @media (max-width: 640px) { .actions .note { display: none; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Ranked Stats, accueil"><span class="brand-mark">R</span><span class="brand-label">Ranked Stats</span></a>
    <nav class="nav">
      <a href="/">Stats</a>
      <a href="/reglages" aria-current="page">Mes comptes</a>
    </nav>
  </header>

  <main>
    <h1>Mes comptes</h1>
    <p class="lead">Coche les jeux auxquels tu joues en ranked et tape tes pseudos. Un jeu décoché disparaît de tes stats.</p>

    <div class="games" id="games"></div>

    <div class="actions">
      <span class="note">🔒 Tes comptes sont gardés dans ton navigateur, chacun voit ses propres stats.</span>
      <a class="btn ghost" href="/">Annuler</a>
      <button class="btn primary" id="save" type="button">Voir mes stats</button>
    </div>
  </main>
  <div class="toast" id="toast"></div>

  <script src="accounts.js"></script>
  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function toast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function render() {
      const saved = Accounts.load();
      $('#games').innerHTML = ACCOUNT_GAMES.map((g) => {
        const c = saved[g.id] || {};
        const fields = g.fields.map((f) => {
          const id = `${g.id}-${f.k}`;
          const input = f.type === 'select'
            ? `<select id="${id}" data-k="${f.k}">${f.options.map(([v, l]) => `<option value="${v}" ${c[f.k] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`
            : `<input id="${id}" data-k="${f.k}" type="text" value="${esc(c[f.k])}" placeholder="${esc(f.ph || '')}" autocomplete="off" spellcheck="false">`;
          return `<div class="field"><label for="${id}">${f.label}</label>${input}${f.hint ? `<small>${f.hint}</small>` : ''}</div>`;
        }).join('');
        return `
          <section class="card game" data-game="${g.id}">
            <div class="game-head">
              <div class="game-badge">${g.short}</div>
              <div><h2>${g.name}</h2><p>${g.desc}</p></div>
              <span class="pill"></span>
              <label class="switch" title="Afficher ${g.name}"><input type="checkbox" data-enabled ${Accounts.isEnabled(g.id, saved[g.id]) ? 'checked' : ''} aria-label="Afficher ${g.name} dans mes stats"><span></span></label>
            </div>
            <div class="game-body">
              <div class="grid">${fields}</div>
              <p class="help">${g.help}</p>
              <div class="test-row">
                <button class="btn" type="button" data-test>Vérifier le compte</button>
                <span class="test-out" aria-live="polite"></span>
              </div>
            </div>
          </section>`;
      }).join('');
      document.querySelectorAll('.game').forEach(updatePill);
    }

    function readGame(card) {
      const out = {};
      card.querySelectorAll('[data-k]').forEach((el) => { out[el.dataset.k] = el.value.trim(); });
      out.enabled = card.querySelector('[data-enabled]').checked;
      return out;
    }

    function updatePill(card) {
      const acc = readGame(card);
      const on = acc.enabled;
      const filled = Accounts.isFilled(card.dataset.game, acc);
      card.classList.toggle('off', !on);
      card.classList.toggle('filled', on && filled);
      card.querySelector('.pill').textContent = !on ? 'Masqué' : filled ? '✓ Suivi' : 'Pseudo manquant';
    }

    document.addEventListener('input', (e) => { const card = e.target.closest('.game'); if (card) updatePill(card); });
    document.addEventListener('change', (e) => { const card = e.target.closest('.game'); if (card) updatePill(card); });

    document.addEventListener('click', async (e) => {
      const testBtn = e.target.closest('[data-test]');
      if (!testBtn) return;
      const card = testBtn.closest('.game');
      const out = card.querySelector('.test-out');
      if (!Accounts.isFilled(card.dataset.game, readGame(card))) { out.className = 'test-out err'; out.textContent = 'Remplis d\'abord ton pseudo'; return; }
      testBtn.disabled = true; out.className = 'test-out'; out.textContent = 'Recherche du compte…';
      try {
        const r = await fetch('/api/player', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game: card.dataset.game, account: readGame(card), force: true }) }).then((x) => x.json());
        if (r.ok) {
          const qs = Object.values(r.history || {});
          const summary = qs.map((q) => `${q.name} : ${q.points.at(-1)?.l || q.points.at(-1)?.v}`).join(' · ');
          out.className = 'test-out ok'; out.textContent = `✓ ${r.meta?.player || 'Compte trouvé'}${summary ? ' — ' + summary : ''}`;
        } else { out.className = 'test-out err'; out.textContent = `✕ ${r.error}`; }
      } catch { out.className = 'test-out err'; out.textContent = '✕ Serveur injoignable'; }
      testBtn.disabled = false;
    });

    $('#save').addEventListener('click', () => {
      const all = {};
      document.querySelectorAll('.game').forEach((card) => { all[card.dataset.game] = readGame(card); });
      if (!Accounts.save(all)) { toast('Impossible d\'enregistrer (navigation privée ?)'); return; }
      location.href = '/';
    });

    render();
  </script>
</body>
</html>
